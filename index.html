<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon SP-API Schema 解析器 & 验证器</title>
    <!-- 引入基础样式和 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- 引入 ref-parser (使用 ESM 模块导入，确保浏览器兼容性) -->
    <script type="module">
        import $RefParser from 'https://cdn.jsdelivr.net/npm/@apidevtools/json-schema-ref-parser/+esm';
        window.$RefParser = $RefParser;
        // 通知系统库已就绪
        window.dispatchEvent(new CustomEvent('ref-parser-ready'));
    </script>
    <script>
        // 兼容性助手
        window.getRefParser = () => window.$RefParser;
    </script>
    <style>
        :root {
            --primary-color: #ff9900; /* Amazon Orange */
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 1.5rem 2rem;
            background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(to right, var(--primary-color), #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .upload-section {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 0.875rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #000;
        }

        .btn-primary:hover {
            background-color: #e68a00;
            transform: translateY(-1px);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* Layout */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            overflow: hidden;
            border-right: 1px solid var(--border-color);
        }

        .pane-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-options {
            display: flex;
            gap: 1rem;
            text-transform: none;
            letter-spacing: normal;
        }

        .filter-label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .form-group.is-required {
            border-left: 3px solid var(--primary-color);
            padding-left: 1rem;
            background: rgba(255, 153, 0, 0.02);
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }

        /* JSON Tree Style */
        pre {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        .string { color: #a5d6ff; }
        .number { color: #d2a8ff; }
        .boolean { color: #ffab70; }
        .null { color: #ff7b72; }
        .key { color: #79c0ff; }

        /* Recursive Layout Styles */
        .root-group {
            background: rgba(255, 255, 255, 0.02);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }
        .nested-group {
            margin-top: 1rem;
            padding-left: 1rem;
            border-left: 2px solid var(--border-color);
            margin-bottom: 0.5rem;
        }
        .array-item {
            margin-top: 0.5rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.8rem;
            border-radius: 6px;
        }
        .object-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .required-star {
            color: var(--error-color);
            margin-left: 4px;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(255, 153, 0, 0.2);
        }

        .form-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
        }

        .hybrid-badge {
            font-size: 11px;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            padding: 2px 8px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 4px;
            margin-left: 8px;
            vertical-align: middle;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 153, 0, 0.1);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
        /* Array Controls */
        .array-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.5rem;
            margin-bottom: 0.8rem;
            border-bottom: 1px dashed var(--border-color);
        }

        .item-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .btn-mini {
            padding: 2px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-add {
            background-color: var(--success-color);
            color: white;
            margin-top: 0.5rem;
        }

        .btn-add:hover {
            background-color: #059669;
        }

        .btn-delete {
            background-color: var(--error-color);
            color: white;
        }

        .btn-delete:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <header>
        <div style="display: flex; flex-direction: column; gap: 4px;">
            <h1>Amazon Schema Parser Pro <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted); margin-left: 10px;">Senior Frontend Tool</span></h1>
            <div id="schemaMeta" style="font-size: 0.85rem; color: var(--accent-color); font-weight: 500;"></div>
        </div>
        <div id="statusInfo" style="color: var(--text-muted); font-size: 0.85rem;"></div>
        <div class="upload-section">
            <div class="file-input-wrapper">
                <button class="btn btn-primary">选择 Schema JSON 文件</button>
                <input type="file" id="fileInput" accept=".json">
            </div>
            <button id="parseBtn" class="btn btn-primary" style="background: var(--accent-color);" disabled>开始解析</button>
        </div>
    </header>

    <main>
        <!-- 左侧：扁平化后的 JSON 结构 -->
        <div class="pane">
            <div class="pane-title">
                <span>Flattened JSON Structure</span>
                <span id="fieldCount" style="color: var(--accent-color);">0 Fields</span>
            </div>
            <div class="scroll-area" id="jsonViewer">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                    <p>等待上传文件并解析...</p>
                </div>
            </div>
        </div>

        <!-- 右侧：表单预览 -->
        <div class="pane">
            <div class="pane-title">
                Form Preview
                <div class="filter-options">
                    <label class="filter-label">
                        <input type="checkbox" id="showRequiredOnly"> Only Required
                    </label>
                </div>
            </div>
            <div class="scroll-area" id="formPreview">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                </div>
            </div>
        </div>
    </main>

    <script>
        /**
         * Senior Frontend Engineer Solution for Amazon SP-API Schema Parsing
         */

        const fileInput = document.getElementById('fileInput');
        const parseBtn = document.getElementById('parseBtn');
        const jsonViewer = document.getElementById('jsonViewer');
        const formPreview = document.getElementById('formPreview');
        const fieldCountEl = document.getElementById('fieldCount');
        const loader = document.getElementById('loader');
        const statusInfo = document.getElementById('statusInfo');
        const schemaMeta = document.getElementById('schemaMeta');
        const showRequiredOnly = document.getElementById('showRequiredOnly');

        let rawSchema = null;
        let allSchema = null;
        let schemaRules = [];
        let formValues = {};

        // 核心初始化：等待库加载并尝试自动解析
        window.addEventListener('DOMContentLoaded', async () => {
            const tryInit = async () => {
                if (!window.getRefParser()) {
                    window.addEventListener('ref-parser-ready', tryInit, { once: true });
                    return;
                }
                
                try {
                    statusInfo.innerText = '正在尝试自动加载本地 amz-jsonschema.json...';
                    // 添加时间戳防止缓存
                    const response = await fetch(`./amz-jsonschema.json?t=${Date.now()}`);
                    console.log('Fetch response status:', response.status);
                    
                    if (response.ok) {
                        const content = await response.json();
                        console.log('File content loaded successfully');
                        processRawContent(content);
                        statusInfo.innerText = '✅ 已自动加载本地 amz-jsonschema.json';
                        statusInfo.style.color = 'var(--success-color, #4ade80)';
                        handleParse();
                    } else {
                        throw new Error(`HTTP Error ${response.status}`);
                    }
                } catch (err) {
                    console.log('自动加载不可用:', err.message);
                    statusInfo.innerText = '💡 请点击下方按钮手动选择本地的 amz-jsonschema.json 文件';
                }
            };

            tryInit();
        });

        function processRawContent(content) {
            try {
                console.log('Processing content, root keys:', Object.keys(content));
                
                // 提取元数据
                if (content.result && content.result.productType) {
                    const pt = content.result.productType;
                    schemaMetadata = {
                        displayName: pt.displayName || 'Unknown',
                        id: pt.productTypeUniqueId || ''
                    };
                    schemaMeta.innerText = `📦 Product Type: ${schemaMetadata.displayName} (${schemaMetadata.id})`;
                } else {
                    schemaMeta.innerText = '';
                }

                // 适配 Amazon SP-API 导出的原始 JSON 格式 (内嵌在 properties 字符串中)
                if (content.result && content.result.productType && content.result.productType.properties) {
                    rawSchema = JSON.parse(content.result.productType.properties);
                } else if (content.properties && typeof content.properties === 'string') {
                    rawSchema = JSON.parse(content.properties);
                } else {
                    rawSchema = content;
                }
                
                console.log('Schema extracted, version:', rawSchema.$schema);
                parseBtn.disabled = false;
            } catch (err) {
                console.error('Content processing failed:', err);
                alert('JSON 结构识别失败: ' + err.message);
            }
        }

        // --- Event Listeners ---

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const content = JSON.parse(event.target.result);
                    processRawContent(content);
                    statusInfo.innerText = `✅ 已手动加载: ${file.name}`;
                    statusInfo.style.color = 'var(--success-color, #4ade80)';
                } catch (err) {
                    alert('文件读取失败: ' + err.message);
                }
            };
            reader.readAsText(file);
        });

        async function handleParse() {
            if (!rawSchema) return;

            const RefParser = window.getRefParser();
            if (!RefParser) {
                alert('关键库 (json-schema-ref-parser) 加载失败。请检查网络连接或尝试在本地 Web 服务器环境下运行。');
                return;
            }

            loader.style.display = 'flex';
            try {
                // Step 1: 展开 $ref (处理内部 $defs)
                const dereferencedSchema = await RefParser.dereference(rawSchema);
                allSchema = dereferencedSchema;
                
                // 提取 if-then 规则
                schemaRules = [];
                if (dereferencedSchema.allOf) {
                    dereferencedSchema.allOf.forEach(item => {
                        if (item.if && item.then) schemaRules.push({ if: item.if, then: item.then });
                    });
                }
                
                formValues = {}; // 重新初始化

                // 解析 $defs 中的默认值并提前注入到 formValues
                if (dereferencedSchema.$defs) {
                    for (const [defKey, defProp] of Object.entries(dereferencedSchema.$defs)) {
                        if (defProp.default !== undefined) {
                            formValues[defKey] = defProp.default;
                        } else if (defProp.anyOf) {
                             const enumPart = defProp.anyOf.find(c => c.enum && c.enum.length > 0);
                             if (enumPart) {
                                 formValues[defKey] = enumPart.enum[0];
                             }
                        }
                    }
                }
                
                lastDynamicRequired = null; 
                lastShowRequiredOnly = null;
                updateFormDisplay(true); // 强制重绘
                
                // 更改左侧面板标题以反映负载构建器
                document.querySelector('.pane-title span').textContent = 'JSON Payload Builder';
            } catch (err) {
                console.error('Parse Error:', err);
                alert('解析出错: ' + err.message + '\n\n提示：如果是 CORS 错误，请在本地开启 Web Server (如 Live Server) 运行。');
            } finally {
                loader.style.display = 'none';
            }
        }

        parseBtn.addEventListener('click', handleParse);
        showRequiredOnly.addEventListener('change', () => updateFormDisplay(true));

        let lastDynamicRequired = null;
        let lastShowRequiredOnly = null;

        // 统一更新表单显示
        function updateFormDisplay(forceRender = false) {
            const dynamicRequired = evaluateRules(formValues);
            
            const currentReqStr = Array.from(dynamicRequired).sort().join(',');
            const currentShowReq = showRequiredOnly.checked;
            
            if (forceRender || currentReqStr !== lastDynamicRequired || currentShowReq !== lastShowRequiredOnly) {
                lastDynamicRequired = currentReqStr;
                lastShowRequiredOnly = currentShowReq;
                renderForm(allSchema, dynamicRequired);
            }
            
            // 转换并展示最终的 Amazon Payload
            const finalPayload = transformToAmazonPayload(formValues);
            renderJsonTree(finalPayload);
        }

        // --- Transformation Logic ---
        function transformToAmazonPayload(formData) {
            const mktId = "ATVPDKIKX0DER"; 

            // --- 深度清理逻辑 (Deep Clean) ---
            function deepClean(obj) {
                if (obj === null || obj === undefined) return undefined;
                
                // 处理数组
                if (Array.isArray(obj)) {
                    const cleanedArr = obj
                        .map(item => deepClean(item))
                        .filter(item => {
                            if (item === undefined || item === null || item === "") return false;
                            if (typeof item === 'object' && Object.keys(item).length === 0) return false;
                            return true;
                        });
                    return cleanedArr.length > 0 ? cleanedArr : undefined;
                }
                
                // 处理对象
                if (typeof obj === 'object') {
                    const result = {};
                    let hasRealValue = false;
                    
                    // 首先处理在 $defs 中全局预填的特殊字段（保证它们在开头）
                    const globalKeys = allSchema && allSchema.$defs ? Object.keys(allSchema.$defs) : [];
                    for (const key of globalKeys) {
                        if (obj[key] !== undefined && !key.startsWith('_')) {
                            const cleanedVal = deepClean(obj[key]);
                            if (cleanedVal !== undefined && cleanedVal !== null && cleanedVal !== "") {
                                result[key] = cleanedVal;
                                // 注意：收集到 globalKeys（如 marketplace_id, language_tag）不算作包含实质内容
                            }
                        }
                    }

                    for (const [key, value] of Object.entries(obj)) {
                        // 跳过 UI 内部私有字段，以及前面已经处理过的全局键
                        if (key.startsWith('_') || globalKeys.includes(key)) continue;

                        const cleanedVal = deepClean(value);
                        if (cleanedVal !== undefined && cleanedVal !== null && cleanedVal !== "") {
                            result[key] = cleanedVal;
                            // 遇到非 global 的业务字段，才标记为有实质内容
                            hasRealValue = true;
                        }
                    }

                    // 补充 marketplace_id 的逻辑：如果对象有 value 但没 marketplace_id
                    if (result.value !== undefined && !result.marketplace_id) {
                        result.marketplace_id = mktId;
                    }

                    // 如果对象里面只有 selectors (如 marketplace_id 或 language_tag) 而没有其他业务字段，视为无效废壳
                    if (Object.keys(result).length > 0 && !hasRealValue) {
                        return undefined;
                    }

                    return Object.keys(result).length > 0 ? result : undefined;
                }
                
                // 处理基础类型
                return obj === "" ? undefined : obj;
            }

            const attributes = deepClean(formData) || {};
            
            const variations = formData._variations || []; 
            
            if (variations.length === 0) {
                const sku = attributes.item_sku?.[0]?.value || attributes.sku?.[0]?.value || "SKU-" + Date.now();
                return [{
                    sku: sku,
                    productType: schemaMetadata.id,
                    attributes: attributes
                }];
            } else {
                const payload = [];
                const parentSku = attributes.item_sku?.[0]?.value || "PARENT-SKU";
                const variationTheme = attributes.variation_theme?.[0]?.value || "SIZE_COLOR";

                const parentAttributes = JSON.parse(JSON.stringify(attributes));
                parentAttributes.parentage_level = [{ value: "parent", marketplace_id: mktId }];
                parentAttributes.variation_theme = [{ value: variationTheme, marketplace_id: mktId }];
                delete parentAttributes.purchasable_offer; 
                
                payload.push({
                    sku: parentSku,
                    productType: schemaMetadata.id,
                    attributes: parentAttributes
                });

                variations.forEach(v => {
                    const childAttributes = JSON.parse(JSON.stringify(attributes));
                    childAttributes.parentage_level = [{ value: "child", marketplace_id: mktId }];
                    childAttributes.child_parent_sku_relationship = [{
                        parent_sku: parentSku,
                        child_relationship_type: "variation",
                        marketplace_id: mktId
                    }];
                    
                    if (v.color) childAttributes.color = [{ value: v.color, marketplace_id: mktId }];
                    if (v.size) childAttributes.size = [{ value: v.size, marketplace_id: mktId }];
                    
                    payload.push({
                        sku: v.sku || (parentSku + "-" + (v.color || '') + (v.size || '')),
                        productType: schemaMetadata.id,
                        attributes: childAttributes
                    });
                });

                return payload;
            }
        }

        // --- Object Path Helpers ---
        function getDeep(obj, path) {
            return path.reduce((acc, key) => (acc && acc[key] !== undefined) ? acc[key] : undefined, obj);
        }

        function setDeep(obj, path, value) {
            let current = obj;
            for (let i = 0; i < path.length - 1; i++) {
                const key = path[i];
                if (current[key] === undefined) {
                    // 如果下一层是数字，则创建数组，否则创建对象
                    current[key] = typeof path[i+1] === 'number' ? [] : {};
                }
                current = current[key];
            }
            current[path[path.length - 1]] = value;
        }

        function addItem(path, schemaNode) {
            let arr = getDeep(formValues, path);
            if (!arr) {
                setDeep(formValues, path, []);
                arr = getDeep(formValues, path);
            }
            
            // 创建一个符合 items 结构的默认值
            let newItem = {};
            if (schemaNode.items && schemaNode.items.type === 'object' && schemaNode.items.properties) {
                // 根据 selectors 自动注入父级的环境参数（如 marketplace_id, language_tag）
                if (schemaNode.selectors && Array.isArray(schemaNode.selectors)) {
                    schemaNode.selectors.forEach(sel => {
                        if (formValues[sel] !== undefined) {
                            newItem[sel] = formValues[sel];
                        }
                    });
                }
            } else if (schemaNode.items && schemaNode.items.type === 'string') {
                newItem = "";
            }
            
            arr.push(newItem);
            updateFormDisplay(true); // 强制重绘
        }

        function removeItem(path, index) {
            const arr = getDeep(formValues, path);
            if (arr && Array.isArray(arr)) {
                arr.splice(index, 1);
                updateFormDisplay(true); // 强制重绘
            }
        }

        // --- Rule Evaluator ---
        function evaluateRules(values) {
            const dynamicRequiredPaths = new Set();
            if (!schemaRules) return dynamicRequiredPaths;

            function matchItem(item, cond) {
                if (!cond || Object.keys(cond).length === 0) return true;
                let isMatch = true;
                
                if (cond.required) {
                    isMatch = isMatch && cond.required.every(k => item && item[k] !== undefined && item[k] !== '');
                }
                
                if (cond.properties) {
                    isMatch = isMatch && Object.entries(cond.properties).every(([k, subCond]) => {
                        let val = item ? item[k] : undefined;
                        // 类型转换支持
                        if (val === 'true') val = true;
                        if (val === 'false') val = false;
                        
                        if (subCond.hasOwnProperty('const')) return val === subCond.const;
                        if (subCond.enum) return subCond.enum.includes(val);
                        
                        // 处理嵌套的 contains / items
                        if (subCond.contains || subCond.items) {
                            const arr = Array.isArray(val) ? val : (val !== undefined ? [val] : []);
                            const target = subCond.contains || subCond.items;
                            return arr.some(subItem => matchItem(subItem, target));
                        }

                        if (subCond.properties || subCond.required) return matchItem(val || {}, subCond);
                        return true;
                    });
                }
                
                if (cond.const !== undefined) {
                    let val = item;
                    if (val === 'true') val = true;
                    if (val === 'false') val = false;
                    isMatch = isMatch && (val === cond.const);
                }

                if (cond.enum) {
                    let val = item;
                    if (val === 'true') val = true;
                    if (val === 'false') val = false;
                    isMatch = isMatch && cond.enum.includes(val);
                }

                return isMatch;
            }

            function checkCond(cond) {
                if (!cond) return false;
                
                // 增加逻辑运算符支持
                if (cond.anyOf) return cond.anyOf.some(c => checkCond(c));
                if (cond.allOf) return cond.allOf.every(c => checkCond(c));
                if (cond.not) return !checkCond(cond.not);

                let isMatch = true;
                let hasCondition = false;

                if (cond.required) {
                    hasCondition = true;
                    isMatch = isMatch && cond.required.every(key => {
                        const val = values[key];
                        if (Array.isArray(val)) return val.length > 0;
                        return val !== undefined && val !== '';
                    });
                }

                if (cond.properties) {
                    hasCondition = true;
                    isMatch = isMatch && Object.entries(cond.properties).every(([key, sub]) => {
                        let val = values[key];
                        if (val === undefined || val === null) val = [];
                        if (!Array.isArray(val)) val = [val]; 
                        
                        const target = sub.contains || sub.items || sub;
                        return val.some(item => matchItem(item, target));
                    });
                }
                
                return hasCondition ? isMatch : false;
            }

            schemaRules.forEach((rule, idx) => {
                if (checkCond(rule.if)) {
                    if (rule.then && rule.then.required) {
                        rule.then.required.forEach(field => dynamicRequiredPaths.add(field));
                    }
                }
            });

            return dynamicRequiredPaths;
        }

        // --- Recursive UI Renderer ---
        function renderForm(schema, dynamicRequired = new Set()) {
            formPreview.innerHTML = '';
            if (!schema || !schema.properties) return;
            
            const rootRequired = schema.required || [];
            const onlyReq = showRequiredOnly.checked;

            // 1. 优先渲染全局定义（$defs 中的设置项）
            const globalKeys = schema.$defs ? Object.keys(schema.$defs) : [];
            if (schema.$defs) {
                for (const defKey of globalKeys) {
                    if (schema.$defs[defKey]) {
                        // 构建一个模拟的 Node 结构供 renderNode 使用
                        const defNode = Object.assign({}, schema.$defs[defKey], {
                            title: schema.$defs[defKey].title || defKey
                        });
                        // 注意这里路径传 [defKey]
                        renderNode(defNode, defKey, [defKey], formPreview, true, dynamicRequired, false);
                    }
                }
            }

            // 2. 渲染其他主体属性
            for (const [key, prop] of Object.entries(schema.properties)) {
                // 跳过已经在上面渲染过的全局键
                if (globalKeys.includes(key)) continue;
                renderNode(prop, key, [key], formPreview, rootRequired.includes(key), dynamicRequired, onlyReq);
            }

            if (formPreview.innerHTML === '') {
                formPreview.innerHTML = '<div class="empty-state"><p>当前没有符合过滤条件的字段</p></div>';
            }
        }

        function renderNode(schemaNode, key, path, container, isRequired = false, dynamicRequiredPaths = new Set(), onlyReq = false) {
            const isRoot = path.length === 1;
            const rootKey = path[0];
            const isDynamicallyRequired = dynamicRequiredPaths.has(rootKey);
            const isCurrentlyRequired = isRequired || isDynamicallyRequired;
            
            // "表单只展示最必要的父项目" -> 如果开启了“仅显示必填”，且当前根节点不是必填，则直接跳过渲染
            if (isRoot && onlyReq && !isCurrentlyRequired) {
                return;
            }

            const group = document.createElement('div');
            group.className = 'form-group ' + (isRoot ? 'root-group' : 'nested-group');
            if (isCurrentlyRequired) group.classList.add('is-required');
            
            const label = document.createElement('label');
            label.className = 'form-label';
            label.innerHTML = `${schemaNode.title || key}${isCurrentlyRequired ? '<span class="required-star">*</span>' : ''}`;
            
            if (isRoot && isDynamicallyRequired) {
                const badge = document.createElement('span');
                badge.className = 'hybrid-badge';
                badge.textContent = '动态必填';
                label.appendChild(badge);
            }
            group.appendChild(label);

            if (schemaNode.description) {
                const desc = document.createElement('div');
                desc.className = 'form-desc';
                desc.textContent = schemaNode.description;
                group.appendChild(desc);
            }

            // 递归渲染核心
            if (schemaNode.type === 'array' && schemaNode.items) {
                const minItems = Math.max(schemaNode.minItems || 0, schemaNode.minUniqueItems || 0);
                const maxItems = Math.min(schemaNode.maxItems || 100, schemaNode.maxUniqueItems || 100);
                
                let currentItems = getDeep(formValues, path);
                
                // 初始化：如果为空且必填或有最小数量要求，先填充
                if (!currentItems || !Array.isArray(currentItems)) {
                    const initCount = isCurrentlyRequired ? Math.max(minItems, 1) : minItems;
                    if (initCount > 0) {
                        currentItems = Array(initCount).fill(0).map(() => {
                            let defaultItem = {};
                            if (schemaNode.items && schemaNode.items.type === 'object') {
                                if (schemaNode.selectors && Array.isArray(schemaNode.selectors)) {
                                    schemaNode.selectors.forEach(sel => {
                                        if (formValues[sel] !== undefined) {
                                            defaultItem[sel] = formValues[sel];
                                        }
                                    });
                                }
                            }
                            return defaultItem;
                        });
                        setDeep(formValues, path, currentItems);
                    } else {
                        currentItems = [];
                    }
                }

                const arrayContainer = document.createElement('div');
                arrayContainer.className = 'array-container';

                currentItems.forEach((item, index) => {
                    const itemWrapper = document.createElement('div');
                    itemWrapper.className = 'array-item';
                    
                    // 条目头部：标题和删除按钮
                    const itemHeader = document.createElement('div');
                    itemHeader.className = 'item-header';
                    
                    const itemTitle = document.createElement('span');
                    itemTitle.className = 'item-title';
                    itemTitle.textContent = `${schemaNode.title || key} #${index + 1}`;
                    itemHeader.appendChild(itemTitle);
                    
                    // 如果超过最小数量，允许删除
                    if (currentItems.length > minItems) {
                        const delBtn = document.createElement('button');
                        delBtn.className = 'btn-mini btn-delete';
                        delBtn.innerHTML = `<span>×</span> 删除`;
                        delBtn.onclick = (e) => {
                            e.preventDefault();
                            removeItem(path, index);
                        };
                        itemHeader.appendChild(delBtn);
                    }
                    
                    itemWrapper.appendChild(itemHeader);
                    
                    // 渲染子节点内容
                    renderNode(schemaNode.items, `Item ${index + 1}`, [...path, index], itemWrapper, false, dynamicRequiredPaths, onlyReq);
                    arrayContainer.appendChild(itemWrapper);
                });

                group.appendChild(arrayContainer);

                // 如果没达到最大数量，允许添加
                if (currentItems.length < maxItems) {
                    const addBtn = document.createElement('button');
                    addBtn.className = 'btn-mini btn-add';
                    addBtn.innerHTML = `<span>+</span> 添加条目`;
                    addBtn.onclick = (e) => {
                        e.preventDefault();
                        addItem(path, schemaNode);
                    };
                    group.appendChild(addBtn);
                }
            } 
            else if (schemaNode.type === 'object' && schemaNode.properties) {
                const objContainer = document.createElement('div');
                objContainer.className = 'object-container';
                const requiredList = schemaNode.required || [];
                
                for (const [subKey, subProp] of Object.entries(schemaNode.properties)) {
                    // 放开对 marketplace_id 和 language_tag 的屏蔽，允许在子对象中根据需要被渲染并由用户独立设定
                    renderNode(subProp, subKey, [...path, subKey], objContainer, requiredList.includes(subKey), dynamicRequiredPaths, onlyReq);
                }
                group.appendChild(objContainer);
            }
            else {
                // 叶子节点 (input/select)
                let el;
                let options = null;
                let isFreeInputAllowed = false;
                
                if (schemaNode.enum) {
                    options = schemaNode.enum.map((v, i) => ({
                        label: (schemaNode.enumNames && schemaNode.enumNames[i]) || v,
                        value: v
                    }));
                } else if (schemaNode.type === 'boolean') {
                    options = [{label: 'Yes', value: true}, {label: 'No', value: false}];
                } else if (schemaNode.anyOf || schemaNode.oneOf) {
                     const comb = (schemaNode.anyOf || []).concat(schemaNode.oneOf || []);
                     const enumPart = comb.find(c => c.enum);
                     const stringPart = comb.find(c => c.type === 'string' && !c.enum);
                     
                     if (enumPart) {
                         options = enumPart.enum.map((v, i) => ({
                             label: (enumPart.enumNames && enumPart.enumNames[i]) || v,
                             value: v
                         }));
                         // 如果同时存在允许任意字符串的条件，说明可以自由输入
                         if (stringPart) {
                             isFreeInputAllowed = true;
                         }
                     }
                }

                const currentVal = getDeep(formValues, path) || '';

                if (options && !isFreeInputAllowed) {
                    el = document.createElement('select');
                    el.className = 'form-control';
                    el.appendChild(new Option('-- 请选择 --', ''));
                    options.forEach(opt => {
                        const o = new Option(opt.label, opt.value);
                        // 关键修复：使用字符串对比，防止 boolean true 和 string "true" 匹配失败
                        if (String(currentVal) === String(opt.value)) o.selected = true;
                        el.appendChild(o);
                    });
                } else {
                    el = document.createElement('input');
                    el.className = 'form-control';
                    el.value = currentVal;
                    el.placeholder = `请输入 ${schemaNode.title || key}`;
                    
                    // 如果是类型限制，应用一些基础校验
                    if (schemaNode.type === 'integer' || schemaNode.type === 'number') el.type = 'number';
                    
                    // 如果既有推荐值（options）又允许自由输入（isFreeInputAllowed），则使用 datalist
                    if (options && isFreeInputAllowed) {
                        const listId = `datalist-${path.join('-')}`;
                        el.setAttribute('list', listId);
                        
                        const datalist = document.createElement('datalist');
                        datalist.id = listId;
                        options.forEach(opt => {
                            const option = document.createElement('option');
                            option.value = opt.value;
                            // datalist option 不支持直接显示 label，如果 label 和 value 不同，可以考虑拼接或只用 value
                            if(opt.label !== opt.value) {
                                option.textContent = opt.label;
                            }
                            datalist.appendChild(option);
                        });
                        group.appendChild(datalist);
                    }
                }

                // 绑定事件：更新深层对象值，并触发规则引擎
                el.addEventListener('change', (e) => {
                    let finalValue = e.target.value;
                    
                    // 通用数据类型适配逻辑
                    if (finalValue !== '') {
                        // 1. 收集当前节点所有允许的类型 (合并 type 和 anyOf/oneOf)
                        let allowedTypes = new Set();
                        if (schemaNode.type) {
                            if (Array.isArray(schemaNode.type)) schemaNode.type.forEach(t => allowedTypes.add(t));
                            else allowedTypes.add(schemaNode.type);
                        }
                        if (schemaNode.anyOf || schemaNode.oneOf) {
                            const comb = (schemaNode.anyOf || []).concat(schemaNode.oneOf || []);
                            comb.forEach(c => {
                                if (c.type) {
                                    if (Array.isArray(c.type)) c.type.forEach(t => allowedTypes.add(t));
                                    else allowedTypes.add(c.type);
                                }
                            });
                        }

                        // 2. 按优先级尝试将字符串转为正确的 JS 类型
                        let converted = false;
                        
                        // 尝试布尔类型
                        if (!converted && allowedTypes.has('boolean')) {
                            if (finalValue === 'true') { finalValue = true; converted = true; }
                            else if (finalValue === 'false') { finalValue = false; converted = true; }
                        }
                        
                        // 尝试数字类型 (number / integer)
                        if (!converted && (allowedTypes.has('number') || allowedTypes.has('integer'))) {
                            const numVal = Number(finalValue);
                            // 确保不是全空格或空字符串，并且是有效的数字
                            if (!isNaN(numVal) && String(finalValue).trim() !== '') {
                                // 如果只允许 integer 且不是整数，则不转换
                                if (allowedTypes.has('integer') && !allowedTypes.has('number')) {
                                    if (Number.isInteger(numVal)) { finalValue = numVal; converted = true; }
                                } else {
                                    finalValue = numVal; converted = true;
                                }
                            }
                        }
                        
                        // 如果经过上面尝试仍未转换成功（即依然是字符串），但 Schema 根本不允许 string，
                        // 则说明这是一个非法的无效输入（比如在数字框里敲了字母），直接置空以便 deepClean 剔除
                        if (!converted && allowedTypes.size > 0 && !allowedTypes.has('string')) {
                            finalValue = '';
                        }
                    }

                    setDeep(formValues, path, finalValue);
                    updateFormDisplay(false);
                });
                
                group.appendChild(el);
            }

            container.appendChild(group);
        }
        // --- JSON Viewer Helpers ---
        function renderJsonTree(data) {
            jsonViewer.innerHTML = '';
            const pre = document.createElement('pre');
            pre.innerHTML = syntaxHighlight(data);
            jsonViewer.appendChild(pre);
        }

        function syntaxHighlight(json) {
            if (typeof json != 'string') json = JSON.stringify(json, undefined, 2);
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, (match) => {
                let cls = 'number';
                if (/^"/.test(match)) {
                    cls = /:$/.test(match) ? 'key' : 'string';
                } else if (/true|false/.test(match)) {
                    cls = 'boolean';
                } else if (/null/.test(match)) {
                    cls = 'null';
                }
                return `<span class="${cls}">${match}</span>`;
            });
        }

    </script>
</body>
